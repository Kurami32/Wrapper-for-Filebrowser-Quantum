version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      android-google:
        patterns:
          - "androidx.*"
          - "com.google.*"
        update-types:
          - "minor"
          - "patch"
      other-minor-patches:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "androidx.*"
          - "com.google.*"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps-wrapper)"
    open-pull-requests-limit: 1
    groups:
      wrapper:
        patterns:
          - "gradle-wrapper"
