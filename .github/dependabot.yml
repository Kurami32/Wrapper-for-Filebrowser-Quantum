version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      android-and-google:
        patterns:
          - "androidx.*"
          - "com.google.*"
          - "com.android.*"
        update-types:
          - "minor"
          - "patch"
      other-minor-patches:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "androidx.*"
          - "com.google.*"
          - "com.android.*"
